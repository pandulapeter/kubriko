name: '[Showcase] Publish iOS'

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XCODE_PROJECT: app/ios/iosApp/iosApp.xcodeproj
  XCODE_SCHEME: iosApp
  DEVELOPMENT_TEAM: N45A6ZHDGY

jobs:
  build:
    name: Build and Publish
    runs-on: macos-latest
    steps:
      - name: Check the signing secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # `gh secret set` stores an empty value without complaining when it has no terminal to
          # prompt on, and an empty secret only surfaces much later as a cryptic codesign or
          # xcodebuild failure. Check the shape of all five here, where the message can be useful.
          PROBLEMS=0
          problem() {
            echo "  $1 - $2" >&2
            PROBLEMS=$((PROBLEMS + 1))
          }
          if [ -z "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]; then
            problem IOS_DISTRIBUTION_CERTIFICATE_BASE64 "empty or unset"
          elif ! printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > /dev/null 2>&1; then
            problem IOS_DISTRIBUTION_CERTIFICATE_BASE64 "not valid base64, expected the output of 'base64 -i <certificate>.p12'"
          fi
          if [ -z "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]; then
            problem IOS_DISTRIBUTION_CERTIFICATE_PASSWORD "empty or unset, expected the password the .p12 was exported with"
          fi
          if [ -z "$ASC_KEY_ID" ]; then
            problem APP_STORE_CONNECT_KEY_ID "empty or unset"
          elif ! [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            problem APP_STORE_CONNECT_KEY_ID "expected 10 upper case letters and digits, as in the AuthKey_<id>.p8 file name"
          fi
          if [ -z "$ASC_ISSUER_ID" ]; then
            problem APP_STORE_CONNECT_ISSUER_ID "empty or unset"
          elif ! [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            problem APP_STORE_CONNECT_ISSUER_ID "expected a UUID, found ${#ASC_ISSUER_ID} characters"
          fi
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            problem APP_STORE_CONNECT_PRIVATE_KEY "empty or unset"
          elif ! printf '%s' "$ASC_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            problem APP_STORE_CONNECT_PRIVATE_KEY "expected the contents of the AuthKey_<id>.p8 file, including its BEGIN PRIVATE KEY line"
          fi
          if [ "$PROBLEMS" -gt 0 ]; then
            echo "" >&2
            echo "Set them from a terminal that can prompt for hidden input:" >&2
            echo "  gh secret set <name> --repo ${{ github.repository }}" >&2
            exit 1
          fi
          echo "All five signing secrets are present and look well formed."
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'
      - name: Read version information
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^showcase\.versionName=//p' gradle.properties)
          BUILD_NUMBER=$(sed -n 's/^showcase\.iosBuildNumber=//p' gradle.properties)
          if [ -z "$VERSION_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "Could not read showcase.versionName / showcase.iosBuildNumber from gradle.properties" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION_NAME ($BUILD_NUMBER)"
          xcodebuild -version
      - name: Apply the production build configuration
        run: |
          # Xcode drives the Gradle build of the shared framework, so the overrides that the
          # Android and web workflows pass with -P have to be written into the file instead.
          for OVERRIDE in areTestExamplesEnabled=false isDebugMenuEnabled=false isSceneEditorEnabled=false shouldShowUnfinishedGames=true; do
            KEY=${OVERRIDE%%=*}
            if ! grep -q "^showcase\.$KEY=" gradle.properties; then
              echo "showcase.$KEY is missing from gradle.properties" >&2
              exit 1
            fi
            sed -i '' "s/^showcase\.$KEY=.*/showcase.$OVERRIDE/" gradle.properties
          done
          grep '^showcase\.' gradle.properties
      - name: Set up code signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          if ! security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12; then
            rm -f "$RUNNER_TEMP/certificate.p12"
            echo "Could not import the certificate, which usually means IOS_DISTRIBUTION_CERTIFICATE_PASSWORD is not the password the .p12 was exported with." >&2
            exit 1
          fi
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          # altool looks for the key by name in this directory, xcodebuild is given the path.
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution'; then
            echo "The certificate imported but left no Apple Distribution signing identity behind." >&2
            echo "Export the .p12 from the My Certificates tab of Keychain Access so that it carries the private key, not just the certificate." >&2
            exit 1
          fi
      - name: Archive the app
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kubriko.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
      - name: Verify the archived version
        run: |
          PLIST="$RUNNER_TEMP/Kubriko.xcarchive/Products/Applications/Kubriko.app/Info.plist"
          ARCHIVED_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          ARCHIVED_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "Archived $ARCHIVED_NAME ($ARCHIVED_BUILD)"
          if [ "$ARCHIVED_NAME" != "${{ steps.version.outputs.name }}" ] || [ "$ARCHIVED_BUILD" != "${{ steps.version.outputs.build }}" ]; then
            echo "The archive does not carry the version from gradle.properties" >&2
            exit 1
          fi
      - name: Export the IPA
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kubriko.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -n 1)
          if [ -z "$IPA" ]; then
            echo "No IPA was exported to $RUNNER_TEMP/export" >&2
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded ${{ steps.version.outputs.name }} (${{ steps.version.outputs.build }}) to App Store Connect."
          echo "It has to finish processing before it shows up in TestFlight, then it needs a manual submission for review."
      - name: Clean up credentials
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8

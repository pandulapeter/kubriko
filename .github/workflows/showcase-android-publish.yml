name: '[Showcase] Publish Android'

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes override, use \n for line breaks (leave empty to generate them from the commit log)'
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'
      - name: Read version information
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^showcase\.versionName=//p' gradle.properties)
          VERSION_CODE=$(sed -n 's/^showcase\.androidVersionCode=//p' gradle.properties)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not read showcase.versionName / showcase.androidVersionCode from gradle.properties" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION_NAME ($VERSION_CODE)"
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_OVERRIDE: ${{ inputs.release_notes }}
        run: |
          mkdir -p whatsnew
          if [ -n "$RELEASE_NOTES_OVERRIDE" ]; then
            printf '%b\n' "$RELEASE_NOTES_OVERRIDE" > release_notes.txt
          else
            WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
            LAST_SHA=$(gh run list --workflow "$WORKFLOW_FILE" --branch "${{ github.ref_name }}" --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ -n "$LAST_SHA" ]; then
              RANGE="$LAST_SHA..HEAD"
            else
              RANGE="-n 20"
            fi
            git log $RANGE --pretty=format:'- %s' > release_notes.txt
          fi
          if [ ! -s release_notes.txt ]; then
            printf -- '- Version %s\n' "${{ steps.version.outputs.name }}" > release_notes.txt
          fi
          awk '{ total += length($0) + 1; if (total > 500) exit; print }' release_notes.txt > whatsnew/whatsnew-en-US
          echo "Generated release notes:"
          cat whatsnew/whatsnew-en-US
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/android/release.keystore
      - name: Build release bundle
        run: |
          ./gradlew :app:android:bundleRelease \
            -Pshowcase.areTestExamplesEnabled=false \
            -Pshowcase.isDebugMenuEnabled=false \
            -Pshowcase.isSceneEditorEnabled=false \
            -Pshowcase.shouldShowUnfinishedGames=true \
            -Pshowcase.androidKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pshowcase.androidKeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -Pshowcase.androidKeystoreFile=release.keystore \
            -Pshowcase.androidKeystorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
      - name: Upload bundle to the Play Console
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pandulapeter.kubrikoShowcase
          releaseFiles: app/android/build/outputs/bundle/release/*.aab
          mappingFile: app/android/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          tracks: production
          status: completed
          changesNotSentForReview: false
          whatsNewDirectory: whatsnew

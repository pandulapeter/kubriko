name: 'Tests'

on:
  pull_request:
  # A merged pull request or a direct push, unless it changes nothing but documentation, which no test reads.
  push:
    branches: [ main ]
    paths-ignore: [ 'documentation/**', '**.md' ]
  workflow_dispatch:
  # For the publishing workflows, which run the unit tests before anything is released.
  workflow_call:
    inputs:
      unit_tests_only:
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  # A newer push to a pull request or to main tests everything the older one would have. A called workflow sees its
  # caller's event, so a release's run shares no group and is never cancelled.
  group: tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      # The checks below take seconds and run before Gradle, whose failure would skip them. .githooks/pre-commit runs
      # them before every commit too; these are the backstop.
      - name: Run the Python scripts' tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      # Every source file, script, workflow and CLAUDE.md carries the MPL-2.0 header.
      - name: Check the license headers
        run: python3 .github/scripts/check_license_headers.py
      # Android's ICU refuses a regular expression's bare brace the JVM, and so every test, accepts.
      - name: Check the regular expressions' braces
        run: python3 .github/scripts/check_regexes.py
      # A pull request or a push to main pushes no Kotlin file or function past the code-style skill's
      # limits, nor grows what is already past them. A push is judged against what main was before it, all of its
      # commits together.
      - name: Check the file and function sizes
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 .github/scripts/check_sizes.py --base "$BASE"
      # --continue reports the failures of every module rather than only the first, and a ktlint violation
      # (spotlessCheck) together with them.
      - name: Run unit tests
        run: ./gradlew spotlessCheck desktopTest :creator:allTests :tools:creator-api:checkKotlinAbi --continue --no-configuration-cache
      - name: Check the web triangle bridge
        run: node engine/src/webMain/checkTriangleBridge.mjs
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  creator-windows:
    name: Kubriko Creator on Windows
    # Kubriko Creator is a desktop app for Windows too, whose paths, shells, and processes differ from the Linux runner's
    # (finding npx through where, starting batch files through cmd); the unit tests job covers Linux.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      - name: Run Kubriko Creator's unit tests
        shell: bash
        run: ./gradlew :creator:allTests --continue --no-configuration-cache
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: creator-windows-test-reports
          path: 'creator/**/build/reports/tests/'

  stress-tests:
    name: Stress tests
    # A called workflow sees its caller's event, so a release dispatched by hand would run these too without the input.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.unit_tests_only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      - name: Run unit tests in stress mode
        run: ./gradlew desktopTest --continue --no-configuration-cache
        env:
          KUBRIKO_STRESS: '1'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stress-test-reports
          path: '**/build/reports/tests/'

  publish-check:
    name: Build every published artifact
    # On macOS, like the release, since only it builds the iOS artifacts. desktopTest compiles the desktop target alone,
    # so this is what catches a module that doesn't build or package for another platform before a release does.
    runs-on: macOS-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      # Everything publishToMavenCentral does except signing and uploading, under a version no release uses.
      - name: Publish every artifact to Maven Local
        run: ./gradlew publishToMavenLocal -Plibrary.version=0.0.0-check --no-configuration-cache
      # Generates every project template with an Actor type and Manager types using every Event and Block, and
      # compiles it for desktop and web against the libraries just published, which the generator tests' exact text
      # can't prove. It downloads every dependency of a generated project, so it runs nightly, not on every change.
      - name: Compile Kubriko Creator's generated projects
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.unit_tests_only
        run: ./gradlew :creator:template:test --tests '*ProjectTemplateIntegrationTest*' --rerun --no-configuration-cache
        env:
          KUBRIKO_CREATOR_INTEGRATION: 'true'
          KUBRIKO_CREATOR_VERSION: '0.0.0-check'
      - name: Upload Kubriko Creator's integration test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: creator-integration-test-reports
          path: 'creator/template/build/reports/tests/'

  creator-end-to-end:
    name: Kubriko Creator end to end
    # Starts the real Kubriko Creator on a Breakout fixture and builds and plays it against this repository's libraries,
    # which no unit test can. Each scenario builds a game with Gradle, so it runs nightly, not on every change.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.unit_tests_only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      - name: Install a virtual display
        run: command -v xvfb-run || { sudo apt-get update --quiet && sudo apt-get install --yes --quiet xvfb; }
      # What :creator:run publishes, under the version it gives them, which the fixture project is built against.
      - name: Publish the libraries Kubriko Creator's projects use to Maven Local
        run: ./gradlew publishDesktopPublicationToMavenLocal publishWasmJsPublicationToMavenLocal publishKotlinMultiplatformPublicationToMavenLocal -Pcreator.localKubriko=true --no-configuration-cache
      - name: Run the end-to-end checks
        run: |
          export KUBRIKO_CREATOR_VERSION="$(sed -n 's/^library\.version=//p' gradle.properties)-creator"
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :creator:test --tests '*endToEnd*' --rerun --no-configuration-cache
        env:
          KUBRIKO_CREATOR_E2E: 'true'
      # The screenshots every scenario saves, to look at when one fails or draws something unexpected.
      - name: Upload the end-to-end checks' images and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: creator-end-to-end
          path: |
            creator/build/end-to-end/
            creator/build/reports/tests/
          if-no-files-found: ignore

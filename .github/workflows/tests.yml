name: '[Library] Tests'

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'
      - name: Run unit tests
        run: ./gradlew desktopTest --continue --no-configuration-cache
      - name: Check the web triangle bridge
        run: node engine/src/webMain/checkTriangleBridge.mjs
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  stress-tests:
    name: Stress tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'
      - name: Run unit tests in stress mode
        run: ./gradlew desktopTest --continue --no-configuration-cache
        env:
          KUBRIKO_STRESS: '1'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stress-test-reports
          path: '**/build/reports/tests/'

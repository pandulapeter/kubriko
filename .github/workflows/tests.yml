name: 'Tests'

on:
  pull_request:
  workflow_dispatch:
  # For the publishing workflows, which run the unit tests before anything is released.
  workflow_call:
    inputs:
      unit_tests_only:
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        # The JetBrains runtime is looked up through the GitHub API, which setup-java only authenticates with this
        # variable (not its token input); unauthenticated, the runner's shared address runs out of requests.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: 'jetbrains'
          java-version: 21
          cache: 'gradle'
      - name: Run unit tests
        run: ./gradlew desktopTest --continue --no-configuration-cache
      - name: Check the web triangle bridge
        run: node engine/src/webMain/checkTriangleBridge.mjs
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  stress-tests:
    name: Stress tests
    # A called workflow sees its caller's event, so a release dispatched by hand would run these too without the input.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.unit_tests_only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        # The JetBrains runtime is looked up through the GitHub API, which setup-java only authenticates with this
        # variable (not its token input); unauthenticated, the runner's shared address runs out of requests.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: 'jetbrains'
          java-version: 21
          cache: 'gradle'
      - name: Run unit tests in stress mode
        run: ./gradlew desktopTest --continue --no-configuration-cache
        env:
          KUBRIKO_STRESS: '1'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stress-test-reports
          path: '**/build/reports/tests/'

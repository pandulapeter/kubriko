# Temporary: one unattended Claude review of Kubriko Creator and its plans, on a branch of its own. Small fixes land as
# commits, larger findings as new or updated files in creator/plan/. Delete this workflow once the review is merged.

name: '[Creator] AI review (temporary)'

on:
  workflow_dispatch:
    inputs:
      budget_usd:
        description: 'Maximum API spend in USD'
        default: '50'
      model:
        description: 'Claude model'
        default: 'claude-opus-5-5'

permissions:
  contents: write

concurrency:
  group: creator-review
  cancel-in-progress: false

jobs:
  review:
    name: Review Kubriko Creator
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      BRANCH: creator-review-${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      # The pre-commit hook runs the license, size, and regex checks and spotlessCheck, so every commit the agent makes
      # passes what Tests would check.
      - name: Create the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.hooksPath .githooks
          git switch -c "$BRANCH"
          git push -u origin "$BRANCH"
      # Warms the Gradle cache, so the agent's first test run doesn't spend its time downloading.
      - name: Build Kubriko Creator
        run: ./gradlew :creator:compileTestKotlin --no-configuration-cache
      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        # Leaves time for the final push below when the review runs long.
        timeout-minutes: 320
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-budget-usd ${{ inputs.budget_usd }}
            --allowedTools Bash,Read,Edit,MultiEdit,Write,Glob,Grep,Task,TodoWrite,WebFetch
          prompt: |
            You are running unattended in GitHub Actions, on the branch `${{ env.BRANCH }}` of the Kubriko repository,
            which is already checked out and pushed. Nobody will answer questions: decide yourself, and record every
            decision that really belongs to the maintainer as an open question in the plan it concerns. You have a
            budget of roughly ${{ inputs.budget_usd }} USD; when it runs out the session stops mid-work, so commit and
            push as you go and spend it in order of value.

            ## Task

            Review all of Kubriko Creator (`creator/`) built so far, together with its plans (`creator/plan/`), and
            improve it for:

            1. scalability: large projects with many Actor types, Scenes, resources, and long Event/Block lists, and
               long-running sessions;
            2. usefulness on complex projects: what a real, bigger game would need that Creator makes hard or
               impossible;
            3. beginner-friendliness: the first hour of someone who knows neither Kotlin nor Gradle, error messages,
               empty states, recoverability from mistakes;
            4. general stability: bugs, races, lifecycle and process handling, file I/O and corrupted or hand-edited
               files, and error handling.

            Look for concrete bugs as well as architectural issues (coupling, responsibilities in the wrong place,
            designs the plans will outgrow, plans that contradict each other or the code).

            ## How to work

            - Start with `CLAUDE.md`, `creator/CLAUDE.md`, `creator/plan/README.md`, and `creator/plan/HANDOVER.md`,
              then the rest of `creator/plan/`, then the code. Read `.claude/skills/code-style/SKILL.md` before editing
              any Kotlin and `.claude/skills/commit-messages/SKILL.md` before committing; follow both exactly (one-line,
              one-sentence commit messages, no trailers). `.claude/skills/codebase-review/SKILL.md` describes how this
              repository triages findings into simple and complex: use its criteria, but not its interactive steps.
            - Use subagents (Task) to read areas in parallel, but verify every finding yourself against the code
              before acting on it. Drop what does not hold.
            - Small, local fixes with one obvious form (a clear bug, a missing check, a wrong message, a stale doc):
              fix them, with a unit test when the fix is testable (Creator's tests are a priority: see
              `creator/CLAUDE.md`), run `./gradlew :creator:test --no-configuration-cache`, and commit each fix on its
              own, staging only its own paths. Then run `git push`.
            - Anything larger (changes to threading, lifecycle, persisted formats, the session protocol, or the
              architecture; anything needing a decision): do not implement it. Add it to the plan file in
              `creator/plan/` it belongs to, or update the item already there, following the plans' conventions (only
              future work, no history or "Done" notes; a new topic gets a new numbered file and a line in the
              roadmap of `creator/plan/README.md`). Each item says what is wrong (with file paths), why it matters,
              and the proposed direction. Commit plan changes in a few cohesive commits and push.
            - Never touch `engine/`, `plugins/`, `tools/`, `examples/`, or `app/` except where a Creator bug cannot be
              fixed otherwise; then plan it instead. Never change published public API.
            - Keep `creator/CLAUDE.md` true for whatever you change. Never rewrite `creator/plan/HANDOVER.md`'s
              "Next" section; add a short note there pointing to the review's plan changes instead.
            - If a commit's pre-commit hook fails, fix the cause; never bypass it with `--no-verify`.
            - Never force push, rebase published commits, switch branches, or push to `main`.

            ## When done (or when the budget is nearly spent)

            Write a summary to `${{ runner.temp }}/creator-review-summary.md`: the fixes committed (commit subject
            each), the plan items added or changed (file and title each), the findings dropped after verification
            with one sentence why, and the open questions for the maintainer. Commit and push whatever is left.
      - name: Push the review branch
        if: always()
        run: git push origin "$BRANCH"
      - name: Publish the summary
        if: always()
        run: |
          summary='${{ runner.temp }}/creator-review-summary.md'
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; else echo 'The review wrote no summary.' >> "$GITHUB_STEP_SUMMARY"; fi
          echo "Branch: \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

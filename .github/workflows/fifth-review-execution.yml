# Lands the fifth review's follow-up plans (issues/F01-F06) on the fifth-review-execution branch: challenges the plans,
# lands one plan per job, then reviews them. Every plan is pushed as soon as it is committed; rerunning the workflow (or its failed jobs) continues from
# the first plan file still in issues/. Dispatched with `gh workflow run fifth-review-execution.yml --ref fifth-review-execution`.
name: '[Review] Fifth review execution'

on:
  workflow_dispatch:

concurrency:
  group: fifth-review-execution
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  challenge:
    uses: ./.github/workflows/fifth-review-step.yml
    secrets: inherit
    with: { kind: challenge, budget: '6' }
  f1:
    needs: challenge
    uses: ./.github/workflows/fifth-review-step.yml
    secrets: inherit
    with: { kind: batch, plans: 'F01', budget: '9' }
  f2:
    needs: f1
    uses: ./.github/workflows/fifth-review-step.yml
    secrets: inherit
    with: { kind: batch, plans: 'F02', budget: '7' }
  f3:
    needs: f2
    uses: ./.github/workflows/fifth-review-step.yml
    secrets: inherit
    with: { kind: batch, plans: 'F03', budget: '7' }
  f4:
    needs: f3
    uses: ./.github/workflows/fifth-review-step.yml
    secrets: inherit
    with: { kind: batch, plans: 'F04', budget: '7' }
  f5:
    needs: f4
    uses: ./.github/workflows/fifth-review-step.yml
    secrets: inherit
    with: { kind: batch, plans: 'F05', budget: '8' }
  f6:
    needs: f5
    uses: ./.github/workflows/fifth-review-step.yml
    secrets: inherit
    with: { kind: batch, plans: 'F06', budget: '10' }
  review:
    needs: f6
    uses: ./.github/workflows/fifth-review-step.yml
    secrets: inherit
    with: { kind: review, plans: 'F01 F02 F03 F04 F05 F06', budget: '6' }

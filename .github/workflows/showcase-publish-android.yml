# Builds the signed release bundle of the Showcase app and uploads it to the production track of the Play Console. With
# "submit" off the release is left as a draft in the Play Console, to be rolled out from there.

name: '[Showcase] Publish Android'

on:
  # The same inputs twice: called by showcase-publish-all.yml, or dispatched by hand to publish Android alone.
  workflow_call:
    inputs:
      release_notes:
        type: string
        required: false
      submit:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes override, use \n for line breaks (leave empty to generate them from the commit log)'
        type: string
        required: false
      submit:
        description: 'Send the release for review (off: leave it as a draft in the Play Console, to change the listing first)'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        # The JetBrains runtime is looked up through the GitHub API, which setup-java only authenticates with this
        # variable (not its token input); unauthenticated, the runner's shared address runs out of requests.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: 'jetbrains'
          java-version: 21
          cache: 'gradle'
      - name: Read version information
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^showcase\.versionName=//p' gradle.properties)
          VERSION_CODE=$(sed -n 's/^showcase\.buildNumber=//p' gradle.properties)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read showcase.versionName / showcase.buildNumber from gradle.properties" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION_NAME ($VERSION_CODE)"
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_OVERRIDE: ${{ inputs.release_notes }}
        run: |
          mkdir -p whatsnew
          if [ -n "$RELEASE_NOTES_OVERRIDE" ]; then
            printf '%b\n' "$RELEASE_NOTES_OVERRIDE" > release_notes.txt
          else
            WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
            LAST_SHA=$(gh run list --workflow "$WORKFLOW_FILE" --branch "${{ github.ref_name }}" --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ -n "$LAST_SHA" ]; then
              RANGE="$LAST_SHA..HEAD"
            else
              RANGE="-n 20"
            fi
            git log $RANGE --pretty=format:'- %s' > release_notes.txt
          fi
          if [ ! -s release_notes.txt ]; then
            printf -- '- Version %s\n' "${{ steps.version.outputs.name }}" > release_notes.txt
          fi
          # The Play Store rejects the whole release when the notes are over its 500 character limit, so they are cut
          # at a line boundary rather than mid-sentence. Characters, not bytes: awk on the runner is mawk, whose
          # length() counts bytes, and would cut a text with accented letters short of what fits.
          python3 - release_notes.txt whatsnew/whatsnew-en-US <<'PYTHON'
          import sys

          LIMIT = 500
          lines = open(sys.argv[1], encoding="utf-8").read().splitlines()
          kept, total = [], 0
          for line in lines:
              total += len(line) + 1
              if total > LIMIT:
                  break
              kept.append(line)
          if not kept and lines:
              # A first line over the limit on its own is cut at the last word that fits rather than leaving the listing
              # with nothing to say.
              first = lines[0][:LIMIT - 1]
              kept = [first.rsplit(" ", 1)[0] if " " in first else first]
          if len(kept) < len(lines):
              print(f"::warning::{sys.argv[2]} was cut to {LIMIT} characters.")
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              output.write("\n".join(kept) + "\n")
          PYTHON
          echo "Generated release notes:"
          cat whatsnew/whatsnew-en-US
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/release.keystore
      # The signing secrets go through local.properties rather than -P: a value on the command line is in the runner's
      # process list for the whole build, and a secret interpolated into the script is re-read by the shell, so a password
      # holding a $, a backtick or a quote would sign the bundle with something other than what is in the secret store.
      # Backslashes are doubled because java.util.Properties treats one as an escape inside a value.
      - name: Build release bundle
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          escape() { printf '%s' "${1//\\/\\\\}"; }
          {
            printf 'showcase.androidKeyAlias=%s\n' "$(escape "$ANDROID_KEY_ALIAS")"
            printf 'showcase.androidKeyPassword=%s\n' "$(escape "$ANDROID_KEY_PASSWORD")"
            printf 'showcase.androidKeystoreFile=release.keystore\n'
            printf 'showcase.androidKeystorePassword=%s\n' "$(escape "$ANDROID_KEYSTORE_PASSWORD")"
          } > local.properties
          ./gradlew :app:android:bundleRelease \
            -Pshowcase.areTestExamplesEnabled=false \
            -Pshowcase.isDebugMenuEnabled=false \
            -Pshowcase.isSceneEditorEnabled=false \
            -Pshowcase.shouldShowUnfinishedGames=true
      - name: Upload bundle to the Play Console
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pandulapeter.kubrikoShowcase
          releaseFiles: app/android/build/outputs/bundle/release/*.aab
          mappingFile: app/android/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          tracks: production
          # A draft is rolled out from the Play Console once whatever the release needs there has been done by hand.
          status: ${{ inputs.submit && 'completed' || 'draft' }}
          changesNotSentForReview: false
          whatsNewDirectory: whatsnew

# One step of fifth-review-execution.yml: Claude Code carries out a batch of review plans, reviews a phase, or finishes the
# run, committing and pushing after every plan, so a rerun continues from the first plan file still in issues/.
name: '[Review] Fifth review step'

on:
  workflow_call:
    inputs:
      kind:
        description: 'batch, review, or finish (the prompt in issues/pipeline/)'
        type: string
        required: true
      plans:
        description: 'The plan IDs, space-separated'
        type: string
        default: ''
      budget:
        description: 'The most this step may spend on the API, in US dollars'
        type: string
        required: true
      runner:
        type: string
        default: 'ubuntu-latest'

env:
  BRANCH: fifth-review-execution
  # Gradle runs of the whole Creator suite take minutes; the agent's shell commands may run that long.
  BASH_DEFAULT_TIMEOUT_MS: '1800000'
  BASH_MAX_TIMEOUT_MS: '3600000'

jobs:
  step:
    name: ${{ inputs.kind }} ${{ inputs.plans }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 330
    steps:
      - name: Check out the branch's latest commit
        uses: actions/checkout@v5
        with:
          ref: fifth-review-execution
          fetch-depth: 0
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.316
      - name: Configure git
        run: |
          git config user.name "Pandula Péter"
          git config user.email "pandulapeter@gmail.com"
          git config core.hooksPath .githooks
      - name: Decide what is left
        id: left
        env:
          KIND: ${{ inputs.kind }}
          PLANS: ${{ inputs.plans }}
        run: |
          left=""
          for id in $PLANS; do
            ls issues/"$id"-*.md >/dev/null 2>&1 || continue
            grep -q "^- $id:" issues/SKIPPED.md 2>/dev/null && continue
            left="$left $id"
          done
          left="${left# }"
          base=""
          if [ "$KIND" = "review" ]; then
            pathspecs=""
            for id in $PLANS; do pathspecs="$pathspecs :(glob)issues/$id-*.md"; done
            first=$(git log --reverse --diff-filter=D --format=%H -- $pathspecs | head -n 1)
            if [ -n "$first" ] && ! grep -qF "## Review of $PLANS" issues/EXECUTION-LOG.md 2>/dev/null; then
              base=$(git rev-parse "$first^")
            fi
          fi
          run=true
          if [ "$KIND" = "batch" ] && [ -z "$left" ]; then run=false; fi
          if [ "$KIND" = "review" ] && [ -z "$base" ]; then run=false; fi
          if [ "$KIND" = "challenge" ] && grep -lq '^\*\*Challenged:\*\*' issues/F0*.md 2>/dev/null; then run=false; fi
          start=$(git merge-base origin/main HEAD)
          {
            echo "left=$left"
            echo "base=$base"
            echo "start=$start"
            echo "run=$run"
          } >> "$GITHUB_OUTPUT"
          echo "Plans left: '$left', review base: '$base', start: $start, run: $run"
      # No blanket permission bypass: edits inside the checkout are accepted, and the shell runs only the commands a plan
      # needs. Pushing is limited to this branch, and force-pushing is refused.
      - name: Run Claude Code
        if: steps.left.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIND: ${{ inputs.kind }}
          BUDGET: ${{ inputs.budget }}
          LEFT: ${{ steps.left.outputs.left }}
          ALL_PLANS: ${{ inputs.plans }}
          BASE: ${{ steps.left.outputs.base }}
          START: ${{ steps.left.outputs.start }}
        run: |
          plans="$LEFT"
          if [ "$KIND" = "review" ]; then plans="$ALL_PLANS"; fi
          sed -e "s|{{BRANCH}}|$BRANCH|g" -e "s|{{PLANS}}|$plans|g" -e "s|{{BASE}}|$BASE|g" -e "s|{{START}}|$START|g" \
            "issues/pipeline/$KIND.md" > "$RUNNER_TEMP/prompt.md"
          set +e
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --model claude-opus-5-5 --effort high \
            --permission-mode acceptEdits \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" "Skill" "Agent" "TodoWrite" \
              "Bash(./gradlew:*)" "Bash(python3 .github/scripts/:*)" "Bash(node engine/src/webMain/checkTriangleBridge.mjs)" \
              "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git add:*)" "Bash(git rm:*)" \
              "Bash(git mv:*)" "Bash(git commit:*)" "Bash(git checkout:*)" "Bash(git restore:*)" "Bash(git cat-file:*)" \
              "Bash(git grep:*)" "Bash(git ls-files:*)" "Bash(git rev-parse:*)" "Bash(git blame:*)" "Bash(git fetch:*)" \
              "Bash(git push origin HEAD:fifth-review-execution)" \
              "Bash(ls:*)" "Bash(cat:*)" "Bash(head:*)" "Bash(tail:*)" "Bash(wc:*)" "Bash(grep:*)" "Bash(find:*)" \
              "Bash(sed:*)" "Bash(awk:*)" "Bash(sort:*)" "Bash(uniq:*)" "Bash(diff:*)" "Bash(test:*)" "Bash(tr:*)" \
              "Bash(mkdir:*)" "Bash(cp:*)" "Bash(mv:*)" "Bash(rm:*)" "Bash(jq:*)" "Bash(echo:*)" "Bash(cd:*)" \
              "Bash(printenv:*)" "Bash(paste:*)" "Bash(bc:*)" "Bash(cut:*)" "Bash(xargs:*)" "Bash(touch:*)" \
              "Bash(basename:*)" "Bash(dirname:*)" "Bash(git check-ignore:*)" "Bash(git stash list)" \
            --disallowedTools "Bash(git push --force:*)" "Bash(git push -f:*)" "Bash(git rebase:*)" "Bash(git reset --hard:*)" \
              "WebFetch" "WebSearch" \
            --max-budget-usd "$BUDGET" --output-format stream-json --verbose \
            > "$RUNNER_TEMP/agent.jsonl" 2> "$RUNNER_TEMP/agent.err"
          status=$?
          set -e
          summary=$(jq -r 'select(.type == "result") | "\(.subtype): $\(.total_cost_usd) in \(.num_turns) turns"' \
            "$RUNNER_TEMP/agent.jsonl" | tail -n 1)
          echo "Claude Code exited with $status ($summary)"
          {
            echo "### $KIND $plans"
            echo "$summary"
            echo
            jq -r 'select(.type == "result") | .result' "$RUNNER_TEMP/agent.jsonl" | tail -n 60
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 "$RUNNER_TEMP/agent.err" || true
      - name: Push what the agent committed
        if: always() && steps.left.outputs.run == 'true'
        run: git push origin "HEAD:$BRANCH" || true
      - name: Check that every plan of the batch landed or was skipped
        if: inputs.kind == 'batch' && steps.left.outputs.run == 'true'
        env:
          PLANS: ${{ inputs.plans }}
        run: |
          git fetch origin "$BRANCH"
          git checkout -q "origin/$BRANCH"
          missing=""
          for id in $PLANS; do
            ls issues/"$id"-*.md >/dev/null 2>&1 || continue
            grep -q "^- $id:" issues/SKIPPED.md 2>/dev/null && continue
            missing="$missing $id"
          done
          if [ -n "$missing" ]; then echo "Not landed:$missing"; exit 1; fi
      - name: Open the pull request
        if: inputs.kind == 'finish' && steps.left.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="build/scratch/pr-body.md"; mkdir -p build/scratch
          [ -s "$body" ] || echo "Lands the remaining plans of the fifth review; see the commits." > "$body"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "Land the fifth review's remaining plans." --body-file "$body" \
              || echo "Could not open the pull request with the workflow's token."
          fi
      - name: Keep the agent's transcript
        if: always() && steps.left.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ inputs.kind }}-${{ inputs.plans }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/agent.jsonl
            ${{ runner.temp }}/agent.err
          if-no-files-found: ignore

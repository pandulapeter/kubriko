# Builds the Showcase app for iOS, signs it for the App Store and uploads it to App Store Connect, where it lands in
# TestFlight. It then waits for the build to be processed and submits it for review with the release notes as its
# "What's New", to be released as soon as Apple approves it. A green run means submitted, not accepted — review answers
# by email. Where another version is still waiting for Apple, the build stays in TestFlight unsubmitted and the run ends
# with a warning instead. With "submit" off it stops short of the submission and leaves the version prepared in App Store
# Connect, for screenshots to be added to and the version submitted from there.
#
# Nothing it signs with can expire: the APPLE_SIGNING_KEY secret holds the team's signing key alone, which Campfire's
# pipeline signs with too, and the run finds the Apple Distribution certificate made for it through the App Store Connect
# API - creating it where there is none, or a new one two months before it expires (.github/scripts/app_store_signing.py)
# - and xcodebuild creates the App Store provisioning profile for it with the same API key. Nothing is ever revoked,
# since a build whose certificate is revoked before App Review approves it is refused.
#
# App Store Connect only accepts a build number it has not seen yet, so repeating an upload takes the build number
# override, which leaves the checked-in gradle.properties as it was.

name: '[Showcase] Publish iOS'

on:
  # The same inputs twice: called by showcase-publish-all.yml, or dispatched by hand to publish iOS alone.
  workflow_call:
    inputs:
      build_number:
        type: string
        required: false
      release_notes:
        type: string
        required: false
      submit:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number to upload under instead of showcase.buildNumber (for a repeated upload)'
        type: string
        required: false
      release_notes:
        description: '"What''s New" override, use \n for line breaks (leave empty to generate it from the commit log)'
        type: string
        required: false
      submit:
        description: 'Submit for review (off: leave the version prepared in App Store Connect, to add screenshots to)'
        type: boolean
        default: true

permissions:
  contents: read
  # To find the last successful run, which the generated release notes start from.
  actions: read

env:
  XCODE_PROJECT: app/ios/iosApp/iosApp.xcodeproj
  XCODE_SCHEME: "[iOS] Showcase Release"
  DEVELOPMENT_TEAM: N45A6ZHDGY

jobs:
  build:
    name: Build and Publish
    runs-on: macos-latest
    steps:
      - name: Check the signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_SIGNING_KEY: ${{ secrets.APPLE_SIGNING_KEY }}
        run: |
          # `gh secret set` stores an empty value without complaining when it has no terminal to
          # prompt on, and an empty secret only surfaces much later as a cryptic codesign or
          # xcodebuild failure. Check the shape of all of them here, where the message can be useful.
          PROBLEMS=0
          problem() {
            echo "::error::$1: $2" >&2
            PROBLEMS=$((PROBLEMS + 1))
          }
          if [ -z "$ASC_KEY_ID" ]; then
            problem APP_STORE_CONNECT_KEY_ID "empty or unset"
          elif ! [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            problem APP_STORE_CONNECT_KEY_ID "expected 10 upper case letters and digits, as in the AuthKey_<id>.p8 file name"
          fi
          if [ -z "$ASC_ISSUER_ID" ]; then
            problem APP_STORE_CONNECT_ISSUER_ID "empty or unset"
          elif ! [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            problem APP_STORE_CONNECT_ISSUER_ID "expected a UUID, found ${#ASC_ISSUER_ID} characters"
          fi
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            problem APP_STORE_CONNECT_PRIVATE_KEY "empty or unset"
          elif ! printf '%s' "$ASC_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            problem APP_STORE_CONNECT_PRIVATE_KEY "expected the contents of the AuthKey_<id>.p8 file, including its BEGIN PRIVATE KEY line"
          fi
          if [ -z "$APPLE_SIGNING_KEY" ]; then
            problem APPLE_SIGNING_KEY "empty or unset"
          elif ! printf '%s' "$APPLE_SIGNING_KEY" | grep -q -- '-----BEGIN \(RSA \)\{0,1\}PRIVATE KEY-----'; then
            problem APPLE_SIGNING_KEY "expected an unencrypted RSA private key as PEM text, BEGIN PRIVATE KEY line included"
          fi
          if [ "$PROBLEMS" -gt 0 ]; then
            echo "" >&2
            echo "Set them from a terminal that can prompt for hidden input, then re-run the failed jobs:" >&2
            echo "  gh secret set <name> --repo ${{ github.repository }}" >&2
            exit 1
          fi
          echo "All signing secrets are present and look well formed."
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: 21
          cache: 'gradle'
      - name: Read version information
        id: version
        env:
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
        run: |
          VERSION_NAME=$(sed -n 's/^showcase\.versionName=//p' gradle.properties | tr -d '\r')
          BUILD_NUMBER=$(sed -n 's/^showcase\.buildNumber=//p' gradle.properties | tr -d '\r')
          if [ -z "$VERSION_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "::error::Could not read showcase.versionName / showcase.buildNumber from gradle.properties" >&2
            exit 1
          fi
          # The version build phase of the Xcode project reads gradle.properties alone, so that is where the override goes.
          if [ -n "$BUILD_NUMBER_OVERRIDE" ]; then
            if ! [[ "$BUILD_NUMBER_OVERRIDE" =~ ^[0-9]+$ ]]; then
              echo "::error::The build number override has to be a whole number, not \"$BUILD_NUMBER_OVERRIDE\"." >&2
              exit 1
            fi
            BUILD_NUMBER=$BUILD_NUMBER_OVERRIDE
            sed -i '' "s/^showcase\.buildNumber=.*/showcase.buildNumber=$BUILD_NUMBER/" gradle.properties
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION_NAME ($BUILD_NUMBER)"
          xcodebuild -version
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_OVERRIDE: ${{ inputs.release_notes }}
        run: |
          if [ -n "$RELEASE_NOTES_OVERRIDE" ]; then
            printf '%b\n' "$RELEASE_NOTES_OVERRIDE" > release_notes.txt
          else
            WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
            LAST_SHA=$(gh run list --workflow "$WORKFLOW_FILE" --branch "${{ github.ref_name }}" --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ -n "$LAST_SHA" ]; then
              RANGE="$LAST_SHA..HEAD"
            else
              RANGE="-n 20"
            fi
            git log $RANGE --pretty=format:'- %s' > release_notes.txt
          fi
          if [ ! -s release_notes.txt ]; then
            printf -- '- Version %s\n' "${{ steps.version.outputs.name }}" > release_notes.txt
          fi
          # App Store Connect refuses a "What's New" over 4000 characters, so a long commit log is cut at a line boundary.
          python3 - release_notes.txt "$RUNNER_TEMP/release-notes.txt" <<'PYTHON'
          import sys

          LIMIT = 4000
          lines = open(sys.argv[1], encoding="utf-8").read().splitlines()
          kept, total = [], 0
          for line in lines:
              total += len(line) + 1
              if total > LIMIT:
                  break
              kept.append(line)
          if not kept and lines:
              first = lines[0][:LIMIT - 1]
              kept = [first.rsplit(" ", 1)[0] if " " in first else first]
          if len(kept) < len(lines):
              print(f"::warning::The release notes were cut to {LIMIT} characters.")
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              output.write("\n".join(kept) + "\n")
          PYTHON
          rm release_notes.txt
          echo "Generated release notes:"
          cat "$RUNNER_TEMP/release-notes.txt"
      - name: Apply the production build configuration
        run: |
          # Xcode drives the Gradle build of the shared framework, so the overrides that the
          # Android and web workflows pass with -P have to be written into the file instead.
          for OVERRIDE in areTestExamplesEnabled=false isDebugMenuEnabled=false isSceneEditorEnabled=false shouldShowUnfinishedGames=true; do
            KEY=${OVERRIDE%%=*}
            if ! grep -q "^showcase\.$KEY=" gradle.properties; then
              echo "::error::showcase.$KEY is missing from gradle.properties" >&2
              exit 1
            fi
            sed -i '' "s/^showcase\.$KEY=.*/showcase.$OVERRIDE/" gradle.properties
          done
          grep '^showcase\.' gradle.properties
      - name: Set up code signing
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_SIGNING_KEY: ${{ secrets.APPLE_SIGNING_KEY }}
        run: |
          # altool looks for the key by name in this directory, xcodebuild and the submission script are given the path.
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          export ASC_KEY_PATH
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          export APPLE_SIGNING_KEY_PATH="$RUNNER_TEMP/apple-signing-key.pem"
          (umask 077 && printf '%s\n' "$APPLE_SIGNING_KEY" > "$APPLE_SIGNING_KEY_PATH")
          python3 .github/scripts/app_store_signing.py certificate DISTRIBUTION "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution: .*($DEVELOPMENT_TEAM)"; then
            security find-identity -v "$KEYCHAIN_PATH"
            echo "::error::The keychain holds no Apple Distribution signing identity of team $DEVELOPMENT_TEAM for the signing key." >&2
            exit 1
          fi
      - name: Archive the app
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kubriko.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
      - name: Verify the archived version
        run: |
          PLIST="$RUNNER_TEMP/Kubriko.xcarchive/Products/Applications/Kubriko.app/Info.plist"
          ARCHIVED_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          ARCHIVED_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "Archived $ARCHIVED_NAME ($ARCHIVED_BUILD)"
          if [ "$ARCHIVED_NAME" != "${{ steps.version.outputs.name }}" ] || [ "$ARCHIVED_BUILD" != "${{ steps.version.outputs.build }}" ]; then
            echo "::error::The archive does not carry ${{ steps.version.outputs.name }} (${{ steps.version.outputs.build }})." >&2
            exit 1
          fi
      - name: Export the IPA
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kubriko.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -n 1)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA was exported to $RUNNER_TEMP/export" >&2
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded ${{ steps.version.outputs.name }} (${{ steps.version.outputs.build }}) to App Store Connect."
          echo "It appears in TestFlight once App Store Connect has processed it."
      # Waits for App Store Connect to process the build, which can take half an hour, and submits it with the release
      # notes as its "What's New" - in the draft version already prepared in App Store Connect where there is one, whose
      # screenshots and release option are kept (.github/scripts/app_store_submission.py).
      - name: Submit for review
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          PREPARE=()
          [ "$SUBMIT" = true ] || PREPARE=(--prepare)
          python3 .github/scripts/app_store_submission.py com.pandulapeter.kubrikoShowcase IOS \
            "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.build }}" "$RUNNER_TEMP/release-notes.txt" "${PREPARE[@]}"
      - name: Clean up credentials
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8 "$RUNNER_TEMP/apple-signing-key.pem"

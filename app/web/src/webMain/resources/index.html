<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubriko</title>
    <link rel="icon" type="image/png" href="metadata/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="metadata/favicon.svg"/>
    <link rel="icon" type="image/x-icon" href="metadata/favicon.ico">
    <link rel="shortcut icon" href="metadata/favicon.ico"/>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        // This script checks to see if a redirect is present in the query string,
        // converts it back into the correct url and adds it to the
        // browser's history using window.history.replaceState(...),
        // which won't cause the browser to attempt to load the new url.
        // When the single page app is loaded further down in this file,
        // the correct url will be waiting in the browser's history for
        // the single page app to route accordingly.
        (function(l) {
          if (l.search[1] === '/' ) {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&')
            }).join('?');
            window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        }(window.location))
    </script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background-color: #6060AA;
        }

        #composeViewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #6060AA;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            z-index: 20;
            transition: opacity 0.4s ease-out;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -o-user-select: none;
            user-select: none;
        }

        .loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loadingScreen img {
            width: 100px;
            height: 100px;
        }

        .loadingProgress {
            width: 100px;
            height: 4px;
            border-radius: 2px;
            background-color: rgba(255, 255, 255, 0.25);
            overflow: hidden;
            visibility: hidden;
        }

        .loadingProgress.tracking {
            visibility: visible;
        }

        .loadingProgress div {
            width: 0;
            height: 100%;
            background-color: white;
            transition: width 0.15s linear;
        }

        .loadingProgress.complete div {
            animation: loadingPulse 1s ease-in-out infinite alternate;
        }

        @keyframes loadingPulse {
            from {
                opacity: 1;
            }
            to {
                opacity: 0.4;
            }
        }

        .loadingMessage {
            max-width: 320px;
            margin: 0 16px;
            color: white;
            font-family: system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.4;
            text-align: center;
        }

        .loadingMessage button {
            display: block;
            margin: 16px auto 0;
            padding: 8px 24px;
            border: 1px solid white;
            border-radius: 4px;
            background-color: transparent;
            color: white;
            font-family: system-ui, sans-serif;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="composeViewport"></div>
<div class="loadingScreen" id="loadingScreen">
    <img src="metadata/logo.webp" alt="Loading...">
    <div class="loadingProgress" id="loadingProgress">
        <div></div>
    </div>
    <p class="loadingMessage" id="loadingMessage" hidden></p>
</div>
<script type="text/javascript">
    // Reports download progress for the resources the app fetches before its first frame, then hands the page
    // over to the app. The production build injects the uncompressed size of every such resource as
    // `kubrikoResourceSizes`; the sizes cannot come from the responses because the server compresses them.
    // Every tracked fetch is wrapped in a stream that counts the bytes as they arrive, which keeps the wasm
    // binaries on the streaming compilation path.
    (function () {
        const loadingScreen = document.getElementById('loadingScreen');
        const progressBar = document.getElementById('loadingProgress');
        const progressFill = progressBar.firstElementChild;
        const loadingMessage = document.getElementById('loadingMessage');
        const originalFetch = window.fetch;
        const expectedSizes = new Map();
        const receivedSizes = new Map();
        let expectedTotal = 0;
        let receivedTotal = 0;
        let completedCount = 0;
        const resolve = (input) => new URL(input instanceof Request ? input.url : String(input), document.baseURI).href;
        const report = (url, receivedBytes) => {
            const expectedBytes = expectedSizes.get(url);
            const previousBytes = receivedSizes.get(url) || 0;
            const currentBytes = Math.min(receivedBytes, expectedBytes);
            receivedSizes.set(url, currentBytes);
            receivedTotal += currentBytes - previousBytes;
            progressFill.style.width = (100 * receivedTotal / expectedTotal) + '%';
            if (receivedBytes >= expectedBytes && previousBytes < expectedBytes && ++completedCount === expectedSizes.size) {
                stopTracking();
                progressBar.classList.add('complete');
            }
        };
        const stopTracking = () => {
            if (window.fetch === trackingFetch) {
                window.fetch = originalFetch;
            }
        };
        const trackingFetch = function (input, init) {
            const url = resolve(input);
            if (!expectedSizes.has(url)) {
                return originalFetch.call(window, input, init);
            }
            return originalFetch.call(window, input, init).then((response) => {
                if (!response.ok || !response.body) {
                    return response;
                }
                let receivedBytes = 0;
                const counter = new TransformStream({
                    transform(chunk, controller) {
                        receivedBytes += chunk.byteLength;
                        report(url, receivedBytes);
                        controller.enqueue(chunk);
                    },
                    flush() {
                        report(url, expectedSizes.get(url));
                    },
                });
                return new Response(response.body.pipeThrough(counter), {
                    status: response.status,
                    statusText: response.statusText,
                    headers: response.headers,
                });
            });
        };
        let isShowingError = false;
        const showError = (message, canReload) => {
            if (isShowingError) {
                return;
            }
            isShowingError = true;
            stopTracking();
            progressBar.classList.remove('tracking');
            loadingMessage.textContent = message;
            if (canReload) {
                const reloadButton = document.createElement('button');
                reloadButton.type = 'button';
                reloadButton.textContent = 'Reload';
                reloadButton.addEventListener('click', () => location.reload());
                loadingMessage.appendChild(reloadButton);
            }
            loadingMessage.hidden = false;
        };
        const showStartFailed = () => showError("Kubriko Showcase couldn't start. Check your connection and reload the page.", true);
        // Errors without the thrown object are benign ResizeObserver notices or sanitized cross-origin
        // "Script error." reports; errors from other origins or extension stacks are not the app's.
        const onError = (event) => {
            if (event.error == null) {
                return;
            }
            if (event.filename && new URL(event.filename, document.baseURI).origin !== location.origin) {
                return;
            }
            showStartFailed();
        };
        const onUnhandledRejection = (event) => {
            const stack = event.reason && event.reason.stack;
            if (typeof stack === 'string' && stack.includes('-extension://')) {
                return;
            }
            showStartFailed();
        };
        window.hideLoadingScreen = () => {
            stopTracking();
            window.removeEventListener('error', onError);
            window.removeEventListener('unhandledrejection', onUnhandledRejection);
            loadingScreen.classList.add('hidden');
            loadingScreen.addEventListener('transitionend', () => loadingScreen.remove(), { once: true });
        };
        const sizes = window.kubrikoResourceSizes;
        if (sizes && typeof TransformStream !== 'undefined') {
            for (const path in sizes) {
                expectedSizes.set(resolve(path), sizes[path]);
                expectedTotal += sizes[path];
            }
            if (expectedTotal > 0) {
                window.fetch = trackingFetch;
                progressBar.classList.add('tracking');
            }
        }
        // A struct type (Wasm GC) and a tag with try / catch_all (legacy exception handling): the two proposals the
        // Kotlin/Wasm binaries are compiled against.
        const isWasmSupported = (() => {
            try {
                return typeof WebAssembly === 'object' && WebAssembly.validate(new Uint8Array([
                    0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
                    0x01, 0x08, 0x02, 0x5f, 0x01, 0x7f, 0x00, 0x60, 0x00, 0x00,
                    0x03, 0x02, 0x01, 0x01,
                    0x0d, 0x03, 0x01, 0x00, 0x01,
                    0x0a, 0x0e, 0x01, 0x0c, 0x00, 0x06, 0x40, 0x41, 0x00, 0xfb, 0x00, 0x00, 0x1a, 0x19, 0x0b, 0x0b,
                ]));
            } catch (e) {
                return false;
            }
        })();
        if (!isWasmSupported) {
            showError("Your browser can't run Kubriko Showcase. Update it, or open this page in a recent version of Chrome, Edge, Firefox or Safari (18.2 or newer).", false);
            return;
        }
        window.addEventListener('error', onError);
        window.addEventListener('unhandledrejection', onUnhandledRejection);
        const appScript = document.createElement('script');
        appScript.src = 'web.js';
        appScript.onerror = showStartFailed;
        document.body.appendChild(appScript);
    })();
</script>
</body>
</html>
